[workspace]
resolver = "2"
members = [
    "crates/hush-core",
    "crates/hush-ffi",
    "crates/hush-cli",
    "apps/desktop/src-tauri",
]

[patch.crates-io]
webrtc-audio-processing-sys = { path = "third_party/webrtc-audio-processing-sys" }

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
cc = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
ctrlc = "3"
deep-filter-rt = "0.2"
hound = "3.5"
libc = "0.2"
nnnoiseless = "0.5"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
realfft = "3"
rustfft = "6"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
webrtc-audio-processing = { version = "~2.1", features = ["bundled"] }
webrtc-audio-processing-config = "~2.1"
