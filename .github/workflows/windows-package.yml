name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # windows-latest here is Visual Studio 2026. This driver project still
    # uses the WindowsKernelModeDriver10.0 toolset, which the WDK registers
    # with Visual Studio 2022. windows-2022 is that image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meson and Ninja
        run: pip install meson ninja
      - name: MSVC for Meson
        shell: pwsh
        run: scripts/ci/use-msvc.ps1
      - name: Test the audio core
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hush-core -p hush-ffi -p hush-cli --release -- --test-threads=8
      - name: Build the CLI
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build -p hush-cli --release
      - name: VB-CABLE hash and round trip
        shell: pwsh
        run: |
          & .\target\release\hush.exe vbcable install --noninteractive
          $code = $LASTEXITCODE
          if ($code -eq 1) { exit 1 }
          if ($code -eq 10) {
            Write-Host "VB-CABLE setup did not expose endpoints without a reboot. Round trip skipped."
          }
          & .\target\release\hush.exe vbcable roundtrip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Self-test on a machine with no HUSH driver
        shell: pwsh
        run: |
          $output = & .\target\release\hush.exe selftest 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($output -match "ring: wrote samples") { exit 0 }
          Write-Host "selftest did not reach the ring check"
          exit 1
      - name: Install the WDK
        shell: pwsh
        run: drivers/windows/install-wdk.ps1
      - name: Build and test-sign the driver
        shell: pwsh
        run: drivers/windows/build-driver.ps1
      - name: Desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Tauri installer
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
          HUSH_DRIVER_DIR: ${{ github.workspace }}\dist\driver
        run: npm run tauri build -- --bundles nsis,msi
      - name: Collect installers
        shell: pwsh
        run: |
          Get-ChildItem -Path target\release\bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName dist\
            Write-Host "installer $($_.FullName)"
          }
          Copy-Item dist\driver\HushTest.cer dist\HushTest.cer -Force
          Get-ChildItem dist | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: hush-windows-test
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi
            dist/HUSH-driver-x64.zip
            dist/HushTest.cer

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meson and Ninja
        run: pip3 install --break-system-packages meson ninja
      - name: Universal HAL plugin
        run: |
          chmod +x drivers/macos/build.sh scripts/macos/*.sh scripts/macos/*.command
          HUSH_UNIVERSAL=1 drivers/macos/build.sh
          lipo -info drivers/macos/build/HUSH.driver/Contents/MacOS/HUSH
      - name: CLI
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build -p hush-cli --release
      - name: App bundle
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          npm ci
          npm run tauri build -- --bundles app
      - name: Developer ID signature
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/macos/sign-if-secrets.sh
      - name: Free disk before packaging
        run: |
          df -h /
          mkdir -p /tmp/hush-ort
          find target/release -name '*onnxruntime*.dylib' -exec cp {} /tmp/hush-ort/ \;
          rm -rf target/release/build target/release/incremental target/release/.fingerprint
          df -h /
      - name: Disk image and package
        run: |
          scripts/macos/build-unsigned-pkg.sh
          scripts/macos/build-unsigned-dmg.sh
          app=$(find target/release/bundle -name 'HUSH.app' -type d | head -n 1)
          tar -C "$(dirname "$app")" -czf dist/HUSH_0.3.0_aarch64.app.tar.gz HUSH.app
          tar -C drivers/macos/build -czf dist/HUSH_0.3.0_HUSH.driver.tar.gz HUSH.driver
          cp install.sh uninstall.sh dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: hush-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz
            dist/install.sh
            dist/uninstall.sh

  release:
    needs: [package, macos]
    # Feature-branch pushes must not move the published tag. A merge to main
    # still updates v0.3.0, which is the existing release job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hush-*
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: HUSH 0.3.0
          prerelease: true
          generate_release_notes: false
          body: |
            Free install. No paid signing certificate, and on Windows Secure Boot stays on.

            macOS, one line:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/psixsaba/HUSH/main/install.sh | bash
            ```

            That script is also attached here as `install.sh`. It downloads `HUSH_0.3.0_aarch64.app.tar.gz` and `HUSH_0.3.0_HUSH.driver.tar.gz`, installs both with one administrator prompt, clears quarantine, and runs `killall coreaudiod`. On macOS 15 Sequoia, if the app is blocked, try to open it and then use System Settings, Privacy & Security, Open Anyway. `uninstall.sh` removes it.

            Windows: run `HUSH_0.3.0_x64-setup.exe`. The installer downloads VB-CABLE Pack45 from VB-Audio, checks SHA-256 `b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb`, and runs VB-Audio's setup. It does not ship the VB-CABLE binaries. Reboot once if asked. In Zoom, Meet, Discord, or Teams select HUSH Microphone. VB-CABLE is donationware: https://vb-audio.com/Cable/ and https://vb-audio.com/Services/donate.htm

            The test-signed HushVad driver is a developer option. See `docs/DEVELOPER.md`. The runners do not place a call.
          files: dist/*
          fail_on_unmatched_files: true
