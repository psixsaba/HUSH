name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # windows-latest here is Visual Studio 2026. This driver project still
    # uses the WindowsKernelModeDriver10.0 toolset, which the WDK registers
    # with Visual Studio 2022. windows-2022 is that image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meson and Ninja
        run: pip install meson ninja
      - name: MSVC for Meson
        shell: pwsh
        run: scripts/ci/use-msvc.ps1
      - name: Test the audio core
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hush-core -p hush-ffi -p hush-cli --release -- --test-threads=8
      - name: Build the CLI
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build -p hush-cli --release
      - name: Self-test on a machine with no HUSH driver
        shell: pwsh
        run: |
          $output = & .\target\release\hush.exe selftest 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($output -match "ring: wrote samples") { exit 0 }
          Write-Host "selftest did not reach the ring check"
          exit 1
      - name: Install the WDK
        shell: pwsh
        run: drivers/windows/install-wdk.ps1
      - name: Build and test-sign the driver
        shell: pwsh
        run: drivers/windows/build-driver.ps1
      - name: Desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Tauri installer
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
          HUSH_DRIVER_DIR: ${{ github.workspace }}\dist\driver
        run: npm run tauri build -- --bundles nsis,msi
      - name: Collect installers
        shell: pwsh
        run: |
          Get-ChildItem -Path target\release\bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName dist\
            Write-Host "installer $($_.FullName)"
          }
          Copy-Item dist\driver\HushTest.cer dist\HushTest.cer -Force
          Get-ChildItem dist | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: hush-windows-test
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi
            dist/HUSH-driver-x64.zip
            dist/HushTest.cer

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meson and Ninja
        run: pip3 install --break-system-packages meson ninja
      - name: Universal HAL plugin
        run: |
          chmod +x drivers/macos/build.sh scripts/macos/*.sh scripts/macos/*.command
          HUSH_UNIVERSAL=1 drivers/macos/build.sh
          lipo -info drivers/macos/build/HUSH.driver/Contents/MacOS/HUSH
      - name: CLI
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build -p hush-cli --release
      - name: App bundle
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          npm ci
          npm run tauri build -- --bundles app
      - name: Disk image and package
        run: |
          scripts/macos/build-unsigned-pkg.sh
          scripts/macos/build-unsigned-dmg.sh
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: hush-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.pkg

  release:
    needs: [package, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hush-*
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: HUSH 0.2.0
          prerelease: true
          generate_release_notes: false
          body: |
            End-user builds of HUSH 0.2.0. Open the app and use the ON/OFF switch. In Zoom, Meet, Discord, or Teams select HUSH Microphone and HUSH Speaker.

            macOS: open `HUSH_0.2.0_aarch64.dmg`, drag HUSH.app to Applications, and run `HUSH_0.2.0_macos.pkg`. The package installs the HAL plugin and restarts coreaudiod. The build is ad-hoc signed and not notarized. If macOS blocks the app, right-click it, choose Open, then Open. `xattr -cr /Applications/HUSH.app` clears the download flag. Steps are in `docs/MAC_TEST.md`.

            Windows: turn Secure Boot off, run `bcdedit /set testsigning on` from an elevated PowerShell, and reboot so the desktop shows Test Mode. Then run the NSIS setup exe or the MSI. `HushTest.cer` is the test certificate. The driver zip password is `hush-test`. Steps are in `docs/WINDOWS_TEST.md`.

            The runners compile and package. They do not load the drivers. A real call still has to be confirmed on each machine.
          files: dist/*
          fail_on_unmatched_files: true
