name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake clang meson ninja-build g++
      - name: Windows Meson
        if: runner.os == 'Windows'
        run: pip install meson ninja
      - name: Test the audio core
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hush-core -p hush-ffi -p hush-cli --release -- --test-threads=8
      - name: Windows desktop shell
        if: runner.os == 'Windows'
        run: cargo build -p hush-cli -p hush-desktop --release
      - name: Windows driver, when the WDK is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -ErrorAction SilentlyContinue
          if (-not $kit) {
            Write-Host "WDK is not on this hosted image. The vendored driver is not compiled here."
            exit 0
          }
          Write-Host "WDK found:"
          $kit | Select-Object -ExpandProperty FullName

  macos-driver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the HAL plugin
        run: |
          chmod +x drivers/macos/build.sh
          HUSH_UNIVERSAL=1 drivers/macos/build.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the desktop shell
        run: cargo check -p hush-desktop --release
