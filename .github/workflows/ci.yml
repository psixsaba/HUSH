name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Visual Studio 2026. Its STL rejects the runner Clang
        # during bindgen (STL1000). windows-2022 matches the package job, which
        # already compiles and tests this tree.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake clang meson ninja-build g++
          echo "LIBRARY_PATH=$(dirname "$(gcc -print-file-name=libstdc++.so)")" >> "$GITHUB_ENV"
      - name: Third-party notices
        if: runner.os == 'Linux'
        run: sh scripts/ci/check-notices.sh
      - name: Windows Meson
        if: runner.os == 'Windows'
        run: pip install meson ninja
      - name: Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/use-msvc.ps1
      - name: macOS Meson
        if: runner.os == 'macOS'
        run: pip3 install --break-system-packages meson ninja
      - name: Test the audio core
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hush-core -p hush-ffi -p hush-cli --release -- --test-threads=8
      - name: Windows desktop shell
        if: runner.os == 'Windows'
        # Git bash puts its usr\bin\link.exe ahead of MSVC link.exe, and Meson
        # then refuses to configure WebRTC. PowerShell keeps the MSVC path
        # written by use-msvc.ps1.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html><title>HUSH</title>' -Encoding ascii
          cargo build -p hush-cli -p hush-desktop --release
  macos-driver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the HAL plugin
        run: |
          chmod +x drivers/macos/build.sh
          HUSH_UNIVERSAL=1 drivers/macos/build.sh
          lipo -info drivers/macos/build/HUSH.driver/Contents/MacOS/HUSH
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: macOS Meson
        run: pip3 install --break-system-packages meson ninja
      - name: Check the desktop shell
        run: |
          mkdir -p apps/desktop/dist
          printf '%s\n' '<!doctype html><title>HUSH</title>' > apps/desktop/dist/index.html
          ls -la apps/desktop/dist
          cargo check -p hush-desktop --release
